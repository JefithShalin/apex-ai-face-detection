<style>
  #attWrap {
    max-width: 720px;
    margin: auto;
    font-family: Arial, sans-serif;
  }

  .att-box {
    background: #0d0d1a;
    padding: 22px;
    border-radius: 14px;
    color: #fff;
  }

  .att-box h2 {
    color: #00d4ff;
    text-align: center;
    margin: 0 0 16px;
  }

  .vid-wrap {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }

  .vid-wrap video {
    width: 100%;
    display: block;
  }

  .vid-wrap canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .att-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .btn-cam {
    background: #00d4ff;
    color: #000;
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }

  .btn-in {
    background: #00c853;
    color: #fff;
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }

  .btn-out {
    background: #ff5722;
    color: #fff;
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }

  .btn-cam:disabled,
  .btn-in:disabled,
  .btn-out:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #attStatus {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    padding: 8px;
    min-height: 28px;
  }

  #attLog table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }

  #attLog th {
    background: #1a1a3a;
    padding: 7px;
    color: #00d4ff;
  }

  #attLog td {
    padding: 6px 7px;
    border-bottom: 1px solid #222;
  }
</style>

<div id="attWrap">
  <div class="att-box">

    <h2>🎯 Face Attendance System</h2>

    <div class="vid-wrap">
      <video id="attVideo" autoplay muted playsinline></video>
      <canvas id="attCanvas"></canvas>
    </div>

    <div class="att-btns">
      <button id="btnAttCam" class="btn-cam" disabled>
        📷 Start Camera
      </button>

      <button id="btnAttIn" class="btn-in" disabled>
        🟢 Mark IN
      </button>

      <button id="btnAttOut" class="btn-out" disabled>
        🔴 Mark OUT
      </button>
    </div>

    <div id="attStatus">
      ⏳ Loading models…
    </div>

    <div id="attLog"></div>

  </div>
</div>
